services:
  pokemon-api:
    build:
      context: ./Kong-Konnect-Pokemon
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=https://+:8080;http://+:8081
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/app/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=password

  kong-gateway:
    image: kong/kong-gateway:3.13
    ports:
      - "8000:8000"
      - "8443:8443"
    environment:
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"
      KONG_VITALS: "off"
      KONG_CLUSTER_MTLS: pki
      KONG_CLUSTER_CONTROL_PLANE: id.us.cp.konghq.com:443
      KONG_CLUSTER_SERVER_NAME: id.us.cp.konghq.com
      KONG_CLUSTER_TELEMETRY_ENDPOINT: id.us.tp.konghq.com:443
      KONG_CLUSTER_TELEMETRY_SERVER_NAME: id.us.tp.konghq.com
      KONG_CLUSTER_CERT: |
        -----BEGIN CERTIFICATE-----
        Certificat
        -----END CERTIFICATE-----
      KONG_CLUSTER_CERT_KEY: |
        -----BEGIN PRIVATE KEY-----
        Private key
        -----END PRIVATE KEY-----
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
      KONG_KONNECT_MODE: "on"
      KONG_ROUTER_FLAVOR: expressions
